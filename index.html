<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專屬學員課程規劃書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --panel:#fff; --ink:#0F172A; --ink2:#475569; --ink3:#94A3B8; --line:#E2E8F0;
  --accent:#1592D6;
  --L1:#6CC9C6; --L2:#8FAEEA; --L3:#B69CF2; --L4:#E39A35;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- 編輯介面 ---------- */
.app{display:grid;grid-template-columns:440px 1fr;height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 20px 60px}
.side h1{font-size:19px;margin:0 0 2px;font-weight:900}
.side .sub{color:var(--ink2);font-size:12.5px;margin:0 0 16px}
.sec-h{font-size:12px;letter-spacing:.12em;color:var(--ink3);font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.field textarea{resize:vertical;min-height:52px}
.field.full{grid-column:1/-1}
.progs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prog{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:#fff;text-align:left;position:relative;overflow:hidden}
.prog b{display:block;font-size:13.5px}
.prog span{font-size:11px;color:var(--ink3)}
.prog::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.prog.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.lv{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.lv.active{box-shadow:0 0 0 2px var(--lc)}
.lv-h{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;background:color-mix(in srgb,var(--lc) 14%,#fff)}
.lv-h .no{font-size:11px;font-weight:900;color:#fff;background:var(--lc);border-radius:6px;padding:2px 6px}
.lv-h .nm{font-weight:700;flex:1}
.lv-h .ct{font-size:12px;color:var(--ink2)}
.lv-h .all{font-size:11.5px;border:1px solid color-mix(in srgb,var(--lc) 60%,#fff);background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer}
.lv-d{padding:8px 12px 2px;font-size:12px;color:var(--ink2);line-height:1.6}
.lv-d .ex{background:#F1F5F9;border-radius:8px;padding:6px 9px;margin:6px 0}
.lv-b{padding:4px 6px 8px}
.lv.collapsed .lv-b,.lv.collapsed .lv-d{display:none}
.ci{display:flex;gap:9px;align-items:flex-start;padding:7px 6px;border-radius:8px;cursor:pointer}
.ci:hover{background:#F8FAFC}
.ci input{margin-top:3px;accent-color:var(--lc);width:16px;height:16px;flex:none}
.ci .t{font-weight:600;font-size:13.5px}
.ci .s{font-size:11.5px;color:var(--ink3);line-height:1.45;margin-top:1px}
.tg{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px;background:#FEF3C7;color:#B45309}
.tg.cert{background:#DCFCE7;color:#15803D}
.tg.res{background:#FCE7F3;color:#BE185D}

.main{overflow:auto;display:flex;flex-direction:column;align-items:center;padding:18px 24px 40px}
.bar{position:sticky;top:0;z-index:5;width:100%;max-width:900px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:6px 0 12px}
.bar .info{flex:1;font-size:12.5px;color:var(--ink2)}
.bar .warn{color:#B91C1C;font-weight:700}
.bar label{font-size:12.5px;color:var(--ink2);display:flex;gap:4px;align-items:center}
.stage{position:relative}
.stage .sheet{transform-origin:top left;box-shadow:0 10px 40px rgba(15,23,42,.18)}

/* ---------- A4 DM ---------- */
.sheet{--k:1;width:210mm;height:297mm;background:#fff;color:#0F172A;overflow:hidden;display:flex;flex-direction:column;
  font-family:var(--font);-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative}
.hd{position:relative;color:#fff;padding:9mm 11mm 7mm;background:linear-gradient(120deg,var(--pc) 0%,color-mix(in srgb,var(--pc) 70%,#0F172A) 100%);overflow:hidden}
.hd::after{content:"";position:absolute;right:-30mm;top:-30mm;width:90mm;height:90mm;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pc2) 55%,transparent),transparent 70%)}
.hd .k{font-size:8.5pt;letter-spacing:.28em;opacity:.85;font-weight:700}
.hd .who{font-size:21pt;font-weight:900;margin:2mm 0 1mm;line-height:1.2;position:relative;z-index:1}
.hd .who em{font-style:normal;border-bottom:2px solid var(--pc2)}
.hd .pn{font-size:12.5pt;font-weight:700;position:relative;z-index:1}
.hd .pn small{font-weight:400;opacity:.8;font-size:8.5pt;margin-left:2mm;letter-spacing:.04em}
.hd .sl{font-size:9pt;opacity:.9;margin-top:1mm;position:relative;z-index:1}
.hd .meta{position:absolute;right:11mm;top:9mm;text-align:right;font-size:8.5pt;line-height:1.6;z-index:1}
.hd .meta b{display:block;font-size:9pt}
.goal{margin-top:2.5mm;display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:3mm;padding:1mm 3mm;font-size:8.5pt;position:relative;z-index:1}

.ov{display:grid;grid-template-columns:64mm 1fr;gap:5mm;padding:4mm 11mm 1mm;align-items:center}
.ov svg{width:100%;height:auto;display:block}
.ov .cap{font-size:7.5pt;color:#64748B;text-align:center;margin-top:1mm}
.path .ph{font-size:8pt;letter-spacing:.2em;color:#94A3B8;font-weight:700;margin-bottom:1.5mm}
.prow{display:grid;grid-template-columns:16mm 1fr;gap:2.5mm;padding:1.6mm 0;border-bottom:1px dashed #E2E8F0}
.prow:last-child{border-bottom:0}
.prow .lb{font-size:7pt;font-weight:900;color:#fff;background:var(--lc);border-radius:1.5mm;text-align:center;padding:.8mm 0;align-self:start;line-height:1.3}
.prow .lb span{display:block;font-size:8.5pt}
.prow.off{opacity:.42}
.prow.off .lb{background:#CBD5E1}
.prow .tt{font-size:9pt;font-weight:700}
.prow .dd{font-size:7.6pt;color:#475569;line-height:1.5}
.prow .ex{font-size:7.4pt;color:#334155;background:#F1F5F9;border-radius:1.5mm;padding:.8mm 2mm;margin-top:.8mm}

.cs{flex:1;min-height:0;overflow:hidden;padding:1mm 11mm 0}
.cs-h{display:flex;align-items:baseline;gap:3mm;margin:1.5mm 0 1.5mm}
.cs-h b{font-size:11pt;font-weight:900}
.cs-h span{font-size:8pt;color:#64748B}
.grp{margin-bottom:calc(2mm*var(--k))}
.grp-h{display:flex;align-items:center;gap:2mm;font-size:calc(8pt*var(--k));font-weight:900;color:color-mix(in srgb,var(--lc) 70%,#0F172A);margin-bottom:calc(1.2mm*var(--k))}
.grp-h i{font-style:normal;background:var(--lc);color:#fff;border-radius:1.2mm;padding:.2mm 1.5mm;font-size:calc(7pt*var(--k))}
.grp-h::after{content:"";flex:1;height:.3mm;background:color-mix(in srgb,var(--lc) 40%,#fff)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:calc(2mm*var(--k)) 3mm}
.card{border:.3mm solid #E2E8F0;border-left:1.2mm solid var(--lc);border-radius:1.6mm;padding:calc(1.6mm*var(--k)) 2.4mm;break-inside:avoid}
.card .n{font-size:calc(9.2pt*var(--k));font-weight:900;line-height:1.3}
.card .n .tg{font-size:calc(6.4pt*var(--k));vertical-align:1px}
.card .tl{font-size:calc(7.2pt*var(--k));color:#64748B;line-height:1.45;margin-top:.4mm}
.card .fr{font-size:calc(7.2pt*var(--k));line-height:1.45;margin-top:.6mm}
.card .fr b{color:var(--pc);font-weight:700}
.card .ms{margin-top:calc(.8mm*var(--k));display:grid;gap:calc(.5mm*var(--k))}
.card .m{font-size:calc(7.2pt*var(--k));line-height:1.45;color:#334155}
.card .m b{font-weight:700;color:#0F172A}
.card .m b::after{content:"｜";color:#CBD5E1;font-weight:400}
.sheet[data-d="1"] .card .tl{display:none}
.sheet[data-d="1"] .card .fr.f{display:none}
.sheet[data-d="2"] .card .tl,.sheet[data-d="2"] .card .fr.f,.sheet[data-d="3"] .card .tl,.sheet[data-d="3"] .card .fr{display:none}
.sheet[data-d="2"] .card .m b+i,.sheet[data-d="3"] .card .m b+i{display:none}
.sheet[data-d="2"] .card .m b::after,.sheet[data-d="3"] .card .m b::after{content:""}
.sheet[data-d="2"] .card .m b::before,.sheet[data-d="3"] .card .m b::before{content:"▸ ";color:var(--lc)}
.sheet[data-d="2"] .card .ms,.sheet[data-d="3"] .card .ms{display:flex;flex-wrap:wrap;gap:.4mm 2.6mm}
.prow.off .dd{display:none}
.cards>.card:last-child:nth-child(odd){grid-column:1/-1}
/* 科目很多時：路徑說明收起、卡片改三欄 */
.sheet[data-d="4"] .card .tl,.sheet[data-d="4"] .card .fr,.sheet[data-d="4"] .card .m b+i,
.sheet[data-d="3"] .prow .dd,.sheet[data-d="3"] .prow .ex,.sheet[data-d="4"] .prow .dd,.sheet[data-d="4"] .prow .ex{display:none}
.sheet[data-d="4"] .cards{grid-template-columns:1fr 1fr 1fr}
.sheet[data-d="4"] .cards>.card:last-child:nth-child(odd){grid-column:auto}
.sheet[data-d="4"] .card .m b::after{content:""}
.sheet[data-d="4"] .card .ms{display:flex;flex-wrap:wrap;gap:.3mm 2mm}
.sheet[data-d="4"] .card .m{font-size:calc(6.6pt*var(--k))}
.sheet[data-d="5"] .card .tl,.sheet[data-d="5"] .card .fr,.sheet[data-d="5"] .card .ms,
.sheet[data-d="5"] .prow .dd,.sheet[data-d="5"] .prow .ex{display:none}
.sheet[data-d="5"] .cards{grid-template-columns:repeat(4,1fr)}
.sheet[data-d="5"] .cards>.card:last-child:nth-child(odd){grid-column:auto}
.empty{border:.4mm dashed #CBD5E1;border-radius:2mm;padding:10mm;text-align:center;color:#94A3B8;font-size:10pt}

.pk{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm;padding:2mm 11mm}
.pk div{background:color-mix(in srgb,var(--pc) 8%,#fff);border-radius:1.6mm;padding:1.4mm 2mm;font-size:7pt;color:#475569;line-height:1.4}
.pk b{display:block;font-size:8pt;color:color-mix(in srgb,var(--pc) 80%,#0F172A)}
.cr{display:flex;gap:1.5mm;flex-wrap:wrap;padding:0 11mm 2mm;font-size:7pt;align-items:center}
.cr .h{font-weight:900;color:#475569;margin-right:1mm}
.cr span.c{border:.3mm solid #E2E8F0;border-radius:5mm;padding:.4mm 2mm;color:#334155}
.cr span.c b{color:var(--pc)}
.ft{display:grid;grid-template-columns:1fr auto;gap:4mm;align-items:center;background:#1E293B;color:#E2E8F0;padding:3.5mm 11mm;font-size:8pt;line-height:1.55}
.ft .br{font-size:10.5pt;font-weight:900;color:#fff}
.ft .ad{opacity:.8}
.ft .cn{margin-top:1mm}
.ft .cn b{color:#fff}
.ft .note{margin-top:1mm;color:#FDE68A}
.ft .qr{display:flex;align-items:center;gap:2.5mm}
.ft .qr img{width:19mm;height:19mm;background:#fff;border-radius:1mm;padding:.8mm;object-fit:contain}
.ft .qr div{font-size:8pt;text-align:right}
.ft .lg{font-size:7pt;opacity:.6}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff;height:auto}
  .side,.bar{display:none!important}
  .app{display:block;height:auto}
  .main{padding:0;overflow:visible;display:block}
  .stage{width:auto!important;height:auto!important}
  .stage .sheet{transform:none!important;box-shadow:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>專屬學員課程規劃書</h1>
    <p class="sub">選專班 → 勾選單科 → 右側即時產出 A4 DM，按「列印／存 PDF」即可。</p>

    <div class="sec-h">STEP 1 · 學員與顧問資料</div>
    <div class="grid2">
      <div class="field"><label>學員姓名</label><input id="f_name" placeholder="王小明"></div>
      <div class="field"><label>規劃日期</label><input id="f_date" type="date"></div>
      <div class="field full"><label>學習目標（選填，會顯示在 DM 標題下）</label><input id="f_goal" placeholder="例：半年內轉職 AI 應用工程師"></div>
      <div class="field"><label>課程顧問</label><input id="f_cons" placeholder="顧問姓名"></div>
      <div class="field"><label>顧問電話</label><input id="f_tel" placeholder="0912-345-678"></div>
      <div class="field"><label>LINE ID（選填）</label><input id="f_line"></div>
      <div class="field"><label>分校</label><select id="f_br"></select></div>
      <div class="field full"><label>顧問備註（選填，顯示在頁尾）</label><input id="f_note" placeholder="例：本月報名享早鳥優惠，名額有限"></div>
      <div class="field full"><label>QR Code 圖片（選填，例如 LINE 或報名連結）</label><input id="f_qr" type="file" accept="image/*"></div>
    </div>

    <div class="sec-h">STEP 2 · 選擇專班</div>
    <div class="progs" id="progs"></div>

    <div class="sec-h">STEP 3 · 勾選單科</div>
    <div class="tools">
      <button class="btn" id="b_core">套用推薦組合</button>
      <button class="btn" id="b_none">全部清除</button>
      <button class="btn" id="b_fold">收合／展開</button>
    </div>
    <div id="levels"></div>
  </aside>

  <main class="main">
    <div class="bar">
      <div class="info" id="info"></div>
      <label><input type="checkbox" id="o_full"> 金字塔全彩</label>
      <label><input type="checkbox" id="o_car" checked> 職涯薪資</label>
      <button class="btn pri" id="b_print">列印／存 PDF</button>
    </div>
    <div class="stage" id="stage"><div class="sheet" id="sheet"></div></div>
  </main>
</div>

<script>
/* 課程資料：由 2026DM 專班 DM 拆解成單科
   course 欄位：
   id, name, tag(一句話), focus(學習重點), result(實戰成果), cert(證照/證明), badge(推薦/軟實力/延伸…),
   core(預設推薦組合), mods:[{t:模組名稱, i:[單元…]}]
*/

/* ---------- AI熟練師：共用科目 ---------- */
const C_GENAI = {id:'genai', name:'生成式AI能力認證', tag:'從零理解生成式 AI，學會用對工具、下對指令', cert:'生成式AI能力認證', core:true,
  mods:[{t:'生成式AI基礎概論',i:['AI趨勢','技術原理','產業應用']},{t:'AI工具與提示詞實作',i:['圖文生成','影音應用','Prompt設計']},{t:'AI導入與認證解析',i:['企業應用','倫理法規','考題解析']}]};
const C_AICORE = {id:'aicore', name:'AI人工智慧核心能力認證', tag:'掌握 AI 核心原理、資料處理與 Python 基礎', cert:'人工智慧核心能力認證',
  mods:[{t:'AI基礎與資料應用',i:['AI發展趨勢','核心技術原理','資料處理分析']},{t:'Python與系統實務',i:['Python基礎','資料結構與流程控制','部署維運']},{t:'AI治理與認證解析',i:['倫理法規','認證重點','模擬試題解析']}]};
const C_AIOFFICE = {id:'aioffice', name:'AI辦公室應用', tag:'快速完成文案、報表與重複作業，優化辦公流程', cert:'生成式AI辦公室應用能力認證', core:true,
  mods:[{t:'Prompt工程與AI工具基礎',i:['提示詞設計','ChatGPT','Copilot']},{t:'辦公室文本與圖像應用實務',i:['文案撰寫','圖像生成','數據資訊視覺化']},{t:'跨工具整合與綜合應用',i:['工具串聯應用','AI專案倡議','延伸應用']}]};

const C_AIAD = {id:'aiad', name:'AI廣告設計（Photoshop）', tag:'AI 產出素材 × 商業影像合成，完成創意海報作品', result:'創意海報設計作品',
  mods:[{t:'介面環境與檔案管理',i:['認識工具面板區','色彩管理與校正','圖層概念與應用']},{t:'商業影像整合設計',i:['影像合成','排版修圖','商業構圖']},{t:'創意海報設計',i:['AI產出素材','海報創意實作','作品成果輸出']}]};
const C_AIBRAND = {id:'aibrand', name:'AI形象設計（Illustrator）', tag:'向量繪圖 × 品牌識別，AI 生成 Logo 與名片 DM', result:'Logo／名片／廣告DM作品',
  mods:[{t:'向量繪圖與插畫設計',i:['物件路徑編輯','筆刷應用','插畫特效']},{t:'品牌視覺與識別設計',i:['文字排版','版面設計','品牌識別']},{t:'創意發想與實作',i:['AI生成Logo','名片設計實作','廣告DM實作']}]};
const C_VISUAL = {id:'visual', name:'視覺行銷實作', tag:'從品牌主視覺到社群素材延伸，完成整合 Mockup', result:'品牌整合 Mockup 作品',
  mods:[{t:'品牌視覺識別設計',i:['品牌定位','主視覺設計','VI系統應用']},{t:'社群品牌行銷實作',i:['品牌素材延伸','社群經營','平台建置']},{t:'作品整合Mockup',i:['介面工具設定','文字編輯技巧','圖文整合應用']}]};
const C_SHORTV = {id:'shortv', name:'AI短影音創作', tag:'AI 腳本分鏡 × 拍攝剪輯，打造品牌短影音與虛擬 IP', result:'品牌短影音成品',
  mods:[{t:'AI腳本企劃與分鏡',i:['腳本生成','分鏡規劃','流程設計']},{t:'拍攝與剪輯實作',i:['構圖運鏡','剪輯轉場','字幕音效']},{t:'影音整合與品牌輸出',i:['動畫製作','虛擬IP打造','成品輸出']}]};

const SKILL_PRO = [
  {id:'p_eff', name:'AI效率應用', tag:'職場效率全面升級', mods:[{i:['辦公室必學的AI工作術','Notion x ChatGPT專案管理實戰','AI工作流']}]},

  sel: store.get('sel', {}),          // { progId: ["levelIdx:courseId", ...] }

  qr: null,
  folded: false,
};
const P = () => PROGRAMS.find(p => p.id === state.prog) || PROGRAMS[0];
const selSet = () => new Set(state.sel[state.prog] || []);
const saveSel = s => { state.sel[state.prog] = [...s]; store.set('sel', state.sel); };

/* ---------- 表單 ---------- */
const FIELDS = ['name','date','goal','cons','tel','line','br','note'];
function initForm(){
  $('f_br').innerHTML = '<option value="">（請選擇分校）</option>' +
    BRANCHES.map((b,i) => `<option value="${i}">${b[0]}　${b[1]}</option>`).join('');
  const saved = store.get('form', {});
  FIELDS.forEach(f => { if(saved[f] != null && f !== 'name' && f !== 'goal' && f !== 'date') $('f_'+f).value = saved[f]; });
  $('f_date').value = new Date().toISOString().slice(0,10);
  FIELDS.forEach(f => $('f_'+f).addEventListener('input', () => {
    const o = {}; FIELDS.forEach(k => o[k] = $('f_'+k).value); store.set('form', o); render();
  }));
  $('f_qr').addEventListener('change', e => {
    const file = e.target.files[0]; if(!file){ state.qr = null; render(); return; }
    const r = new FileReader(); r.onload = () => { state.qr = r.result; render(); }; r.readAsDataURL(file);
  });
}

/* ---------- 專班 & 科目清單 ---------- */
function renderProgs(){
  $('progs').innerHTML = PROGRAMS.map(p => {
    const n = (state.sel[p.id] || []).length;
    return `<button class="prog ${p.id===state.prog?'on':''}" style="--c:${p.color}" data-p="${p.id}">
      <b>${esc(p.name)}</b><span>${n ? '已選 '+n+' 科' : p.levels.reduce((a,l)=>a+l.courses.length,0)+' 個單科'}</span></button>`;
  }).join('');
  $('progs').querySelectorAll('.prog').forEach(b => b.onclick = () => {
    state.prog = b.dataset.p; store.set('prog', state.prog); state.activeLv = 3; renderAll();
  });
}

function badges(c){
  let h = '';
  if(c.badge) h += `<span class="tg">${esc(c.badge)}</span>`;
  if(c.cert) h += `<span class="tg cert">證照</span>`;
  if(c.result) h += `<span class="tg res">成果</span>`;
  return h;
}

function renderLevels(){
  const p = P(), s = selSet();
  const order = [3,2,1,0];
  $('levels').innerHTML = order.map(li => {
    const L = p.levels[li];
    const n = L.courses.filter(c => s.has(li+':'+c.id)).length;
    return `<div class="lv ${state.activeLv===li?'active':''} ${state.folded && state.activeLv!==li?'collapsed':''}" style="--lc:${LC[li]}" data-lv="${li}">
      <div class="lv-h"><span class="no">LEVEL ${L.no}</span><span class="nm">${L.icon} ${esc(L.name)}</span>
        <span class="ct">${n}/${L.courses.length}</span><button class="all" data-all="${li}">${n===L.courses.length?'取消':'全選'}</button></div>
      <div class="lv-d">${esc(L.desc)}<div class="ex">💡 <b>舉例：</b>${esc(L.example)}</div></div>
      <div class="lv-b">${L.courses.map(c => `
        <label class="ci"><input type="checkbox" data-k="${li}:${c.id}" ${s.has(li+':'+c.id)?'checked':''}>
          <div><div class="t">${esc(c.name)}${badges(c)}</div><div class="s">${esc(c.tag||'')}</div></div></label>`).join('')}
      </div></div>`;
  }).join('');

  $('levels').querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const s = selSet(); cb.checked ? s.add(cb.dataset.k) : s.delete(cb.dataset.k);
    state.activeLv = +cb.dataset.k.split(':')[0];
    saveSel(s); renderProgs(); refreshLevelHeads(); render();
  });
  $('levels').querySelectorAll('[data-all]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const li = +b.dataset.all, L = P().levels[li], s = selSet();
    const keys = L.courses.map(c => li+':'+c.id);
    const allOn = keys.every(k => s.has(k));
    keys.forEach(k => allOn ? s.delete(k) : s.add(k));
    state.activeLv = li; saveSel(s); renderAll();
  });
  $('levels').querySelectorAll('.lv-h').forEach(h => h.onclick = () => {
    const li = +h.parentElement.dataset.lv;
    if(state.folded){ state.activeLv = li; renderLevels(); } else { state.activeLv = li; markActive(); }
    render();
  });
}
function refreshLevelHeads(){
  const p = P(), s = selSet();
  document.querySelectorAll('.lv').forEach(el => {
    const li = +el.dataset.lv, L = p.levels[li];
    const n = L.courses.filter(c => s.has(li+':'+c.id)).length;
    el.querySelector('.ct').textContent = n+'/'+L.courses.length;
    el.querySelector('.all').textContent = n===L.courses.length ? '取消' : '全選';
  });
  markActive();
}
function markActive(){ document.querySelectorAll('.lv').forEach(el => el.classList.toggle('active', +el.dataset.lv===state.activeLv)); }

/* ---------- 金字塔 SVG ---------- */
function pyramidSVG(p, counts, opts){
  const W = 320, top = 26, bandH = 60, gap = 6, H = top + 4*bandH + 3*gap;
  const hw = y => 40 + (y - top) * (120 / (H - top));
  let out = `<svg viewBox="0 0 ${W} ${H+4}" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
    <defs><linearGradient id="apx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${LCHEX[3]}" stop-opacity="0"/><stop offset="1" stop-color="${LCHEX[3]}"/></linearGradient></defs>
    <rect x="${W/2-1.5}" y="0" width="3" height="${top-6}" rx="1.5" fill="url(#apx)"/>`;
  for(let li = 0; li < 4; li++){
    const y0 = top + (3-li)*(bandH+gap), y1 = y0 + bandH;
    const a = hw(y0), b = hw(y1), cx = W/2;
    const on = opts.full || counts[li] > 0;
    const fill = on ? LCHEX[li] : '#E8ECF2';
    const tc = on ? '#fff' : '#A0AEC0';
    const L = p.levels[li];
    const act = opts.active === li;
    out += `<g data-lv="${li}" style="cursor:${opts.interactive?'pointer':'default'}">
      <path d="M${cx-a} ${y0} L${cx+a} ${y0} L${cx+b} ${y1} L${cx-b} ${y1} Z" fill="${fill}" ${act&&opts.interactive?'stroke="#0F172A" stroke-width="2"':''}/>
      <text x="${cx}" y="${y0+bandH/2 - (counts[li]?3:-4)}" text-anchor="middle" fill="${tc}" font-size="14" font-weight="700">
        <tspan font-size="10" opacity=".75">${L.no}</tspan>  ${L.icon} ${esc(L.name)}</text>
      ${counts[li] ? `<text x="${cx}" y="${y0+bandH/2+15}" text-anchor="middle" fill="#fff" font-size="10" opacity=".95">已規劃 ${counts[li]} 科</text>` : ''}
    </g>`;
  }
  return out + '</svg>';
}

/* ---------- A4 ---------- */
function render(){
  const p = P(), s = selSet(), sheet = $('sheet');
  const f = {}; FIELDS.forEach(k => f[k] = $('f_'+k).value.trim());
  const br = f.br !== '' ? BRANCHES[+f.br] : null;
  const counts = p.levels.map((L,li) => L.courses.filter(c => s.has(li+':'+c.id)).length);
  const total = counts.reduce((a,b)=>a+b,0);
  const chosen = p.levels.map((L,li) => L.courses.filter(c => s.has(li+':'+c.id)));
  const nMods = chosen.flat().reduce((a,c)=>a+c.mods.length,0);
  const nCert = chosen.flat().filter(c=>c.cert).length;
  const topLv = [3,2,1,0].find(li => counts[li]) ?? -1;
  const d = f.date ? f.date.replace(/-/g,'/') : '';

  sheet.style.setProperty('--pc', p.color);
  sheet.style.setProperty('--pc2', p.color2);

  const pathRows = [3,2,1,0].map(li => {
    const L = p.levels[li], on = counts[li] > 0 || $('o_full').checked;
    return `<div class="prow ${on?'':'off'}" style="--lc:${LC[li]}">
      <div class="lb">LEVEL<span>${L.no}</span></div>
      <div><div class="tt">${L.icon} ${esc(L.title)}</div><div class="dd">${esc(L.desc)}</div>
      ${li===topLv ? `<div class="ex">💡 <b>舉例：</b>${esc(L.example)}</div>` : ''}</div></div>`;
  }).join('');

  const groups = [0,1,2,3].filter(li => chosen[li].length).map(li => {
    const L = p.levels[li];
    return `<div class="grp" style="--lc:${LC[li]}">
      <div class="grp-h"><i>LEVEL ${L.no}</i>${L.icon} ${esc(L.name)}</div>
      <div class="cards">${chosen[li].map(c => `
        <div class="card"><div class="n">${esc(c.name)}${c.badge?`<span class="tg">${esc(c.badge)}</span>`:''}</div>
          ${c.tag?`<div class="tl">${esc(c.tag)}</div>`:''}
          ${c.focus?`<div class="fr f"><b>學習重點</b>　${esc(c.focus)}</div>`:''}
          ${c.result?`<div class="fr"><b>實戰成果</b>　${esc(c.result)}</div>`:''}
          ${c.cert?`<div class="fr"><b>取得證照</b>　${esc(c.cert)}</div>`:''}
          <div class="ms">${c.mods.map(m => m.t
            ? `<div class="m"><b>${esc(m.t)}</b><i>${m.i.map(esc).join('・')}</i></div>`
            : `<div class="m">${m.i.map(esc).join('・')}</div>`).join('')}</div>
        </div>`).join('')}</div></div>`;
  }).join('');

  sheet.innerHTML = `
    <div class="hd">
      <div class="k">PERSONAL LEARNING PLAN · 專屬學員課程規劃書</div>
      <div class="who">為 <em>${esc(f.name || '　　　')}</em> 量身打造的學習路徑</div>
      <div class="pn">${esc(p.name)}<small>${esc(p.en)}</small></div>
      <div class="sl">${esc(p.slogan)}</div>
      ${f.goal ? `<div class="goal">🎯 學習目標：${esc(f.goal)}</div>` : ''}
      <div class="meta">${d?`<b>規劃日期</b>${d}<br>`:''}<b>規劃內容</b>${total} 科・${nMods} 個模組${nCert?`<br><b>證照／證明</b>${nCert} 張`:''}</div>
    </div>
    <div class="ov">
      <div>${pyramidSVG(p, counts, {full:$('o_full').checked})}<div class="cap">${esc(p.pyramidNote)}</div></div>
      <div class="path"><div class="ph">LEARNING PATH · 四層學習路徑</div>${pathRows}</div>
    </div>
    <div class="cs" id="cs">
      <div class="cs-h"><b>規劃科目</b><span>依學習層級由基礎到進階排列</span></div>
      ${groups || '<div class="empty">請在左側勾選要規劃給學員的單科</div>'}
    </div>
    <div class="pk">${p.perks.map(x => `<div><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join('')}</div>
    ${$('o_car').checked ? `<div class="cr"><span class="h">職涯出路</span>${p.careers.map(c => `<span class="c">${esc(c[0])} <b>${esc(c[1])}</b></span>`).join('')}<span style="color:#94A3B8">薪資參考：人力銀行，實際依各公司職務而異</span></div>` : ''}
    <div class="ft">
      <div>
        <div class="br">聯成電腦 ${esc(br ? br[0] : '')}</div>
        ${br ? `<div class="ad">☎ ${esc(br[1])}　📍 ${esc(br[2])}</div>` : '<div class="ad">（請於左側選擇分校）</div>'}
        ${(f.cons||f.tel||f.line) ? `<div class="cn">課程顧問 <b>${esc(f.cons)}</b>${f.tel?`　📱 ${esc(f.tel)}`:''}${f.line?`　LINE：${esc(f.line)}`:''}</div>` : ''}
        ${f.note ? `<div class="note">★ ${esc(f.note)}</div>` : ''}
        <div class="lg">課程內容依班級整體程度調整，詳細課綱以實際授課為準｜完整立案資訊詳見官網 www.lccnet.com.tw</div>
      </div>
      ${state.qr ? `<div class="qr"><div>掃描 QR 碼<br>免費諮詢</div><img src="${state.qr}" alt=""></div>` : ''}
    </div>`;

  fit(sheet);
  const over = sheet.dataset.over === '1';
  $('info').innerHTML = `<b>${esc(p.name)}</b>｜已選 ${total} 科 ${over ? '<span class="warn">・內容超出一頁，建議減少科目</span>' : (sheet.dataset.d!=='0' ? '・已自動精簡排版以塞進 A4' : '')}`;
  document.title = `課程規劃書_${f.name || '學員'}_${p.name.replace(/\s/g,'')}`;
  scaleStage();
}

/* 自動縮排：先縮字，再精簡內容，確保一頁 A4 */
function fit(sheet){
  const cs = sheet.querySelector('#cs');
  const over = () => cs.scrollHeight > cs.clientHeight + 1;
  const setK = k => sheet.style.setProperty('--k', k.toFixed(2));
  sheet.dataset.over = '0';
  for(const d of ['0','1','2','3','4','5']){
    sheet.dataset.d = d;
    for(let k = 1; k >= (d >= '4' ? 0.7 : 0.82); k -= 0.03){
      setK(k);
      if(over()) continue;
      // 精簡模式下若還有空間，把字放大填滿版面
      if(d >= '2'){ while(k < 1.3){ setK(k + 0.03); if(over()){ setK(k); break; } k += 0.03; } }
      return;
    }
  }
  sheet.dataset.over = '1';
}

function scaleStage(){
  const main = document.querySelector('.main'), stage = $('stage'), sheet = $('sheet');
  const w = sheet.offsetWidth, h = sheet.offsetHeight;
  const avail = Math.min(main.clientWidth - 48, 900);
  const sc = Math.min(1, avail / w);
  sheet.style.transform = `scale(${sc})`;
  stage.style.width = w*sc + 'px'; stage.style.height = h*sc + 'px';
}

function renderAll(){ document.documentElement.style.setProperty('--accent', P().color); renderProgs(); renderLevels(); render(); }

/* ---------- 按鈕 ---------- */
$('b_core').onclick = () => {
  const s = new Set(); P().levels.forEach((L,li) => L.courses.forEach(c => { if(c.core) s.add(li+':'+c.id); }));
  saveSel(s); renderAll();
};
$('b_none').onclick = () => { saveSel(new Set()); renderAll(); };
$('b_fold').onclick = () => { state.folded = !state.folded; renderLevels(); };
$('b_print').onclick = () => {
  if($('sheet').dataset.over === '1' && !confirm('科目太多，部分內容會被截掉，仍要列印嗎？\n（建議取消幾個科目再列印）')) return;
  window.print();
};
$('o_full').onchange = render; $('o_car').onchange = render;
$('sheet').addEventListener('click', e => {
  const g = e.target.closest('g[data-lv]'); if(!g) return;
  state.activeLv = +g.dataset.lv; state.folded = true; renderLevels();
  document.querySelector(`.lv[data-lv="${state.activeLv}"]`)?.scrollIntoView({behavior:'smooth', block:'start'});
});
window.addEventListener('resize', scaleStage);
window.addEventListener('beforeprint', () => { $('sheet').style.transform = 'none'; });
window.addEventListener('afterprint', scaleStage);

initForm();
renderAll();
document.fonts && document.fonts.ready.then(render);
</script>
</body>
